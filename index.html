<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>부채 분석 OCR 웹앱</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>PDF OCR 부채 자동 분석</h1>

  <p>
    <input type="file" id="fileInput" accept="application/pdf,image/*" />
    <button id="runBtn">OCR 실행</button>
    <button id="excelBtn">엑셀 다운로드</button>
  </p>

  <div class="small">
    - PDF 또는 이미지 선택 후 "OCR 실행"<br>
    - 브라우저에서만 동작 (Tesseract.js + pdf.js)<br>
    - 서버/비용 없음
  </div>

  <h3>로그</h3>
  <div id="log"></div>

  <h3>부채 리스트 (자동 추출)</h3>
  <table id="debtTable">
    <thead>
      <tr>
        <th>#</th>
        <th>유형</th>
        <th>기관명</th>
        <th>코드</th>
        <th>발생일</th>
        <th>해제/만기일</th>
        <th>등록금액</th>
        <th>연체금액</th>
        <th>흐름</th>
        <th>원문</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3>기관별 합계</h3>
  <table id="sumTable">
    <thead>
      <tr>
        <th>기관명</th>
        <th>등록금액 합계</th>
        <th>연체금액 합계</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h3>그래프 시각화</h3>
  <canvas id="chart" height="120"></canvas>

  <canvas id="pdfCanvas"></canvas>

  <!-- OCR 엔진 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- SheetJS (엑셀 다운로드) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- 메인 로직 -->
  <script src="app.js"></script>
</body>
</html>
