<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PDF OCR (Tesseract.js + PDF.js)</title>
</head>
<body>
  <h2>PDF OCR 테스트</h2>

  <input type="file" id="pdfInput" accept="application/pdf">
  <pre id="output"></pre>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <!-- Tesseract.js -->

  <script src="app.js"></script>
</body>
</html>
